[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # firebase 13 pulls @firebase/ai which needs Node >= 24.12
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback — all unknown paths serve index.html so react-router can handle them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
